[project]
name = "mavlink-gui"
version = "0.1.0"
description = "MAVLink UDP 遙測 Web GUI：Dashboard 與即時地圖軌跡"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymavlink>=2.4.41",
]

[project.scripts]
mavlink-gui = "mavlink_gui:main"
mavlink-test-sender = "send_test_packets_14666:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["mavlink_gui.py", "send_test_packets_14666.py"]
